[tool.poetry]
name = "newswithwilly"
version = "0.1.0"
description = "News monitoring and trading alert system"
authors = ["Willy <willy@example.com>"]
readme = "README.md"
packages = [{ include = "newswithwilly", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = "^2.10.6"
sqlalchemy = {version = "^2.0.36", extras = ["asyncio"]}
aiosqlite = "^0.20.0"
asyncpg = "^0.30.0"
alembic = "^1.14.1"
beautifulsoup4 = "^4.12.3"
tweepy = "^4.14.0"
anthropic = "^0.49.0"
apscheduler = "^3.11.0"
python-dotenv = "^1.0.1"
requests = "^2.32.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
ruff = "^0.11.2"
coverage = "^7.6.10"

[tool.poetry.scripts]
newswithwilly = "newswithwilly.main:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
